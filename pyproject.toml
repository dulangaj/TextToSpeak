[project]
name = "speakctl"
version = "0.1.0"
description = "Local text-to-speech on macOS via MLX-Audio (Kokoro-82M)."
requires-python = ">=3.10"
dependencies = [
    "mlx-audio>=0.5",
    "misaki[en]>=0.9",
]

[project.scripts]
speak = "speakctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakctl"]
